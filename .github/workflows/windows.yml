name: Windows build

# Builds the Windows installer and a portable zip. The panel is GTK4, which on
# Windows comes from MSYS2, so the whole build runs inside MSYS2 UCRT64 and
# only the installer step (Inno Setup) runs outside it.

on:
  push:
    branches: [main, windows]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib

      - name: Check the package runs from source
        run: |
          python -m msi_rgb --help
          python -m msi_rgb effects
          python -c "import msi_rgb.direct as d; print('hidapi:', d._load_hidapi())"
          # No controller on a CI runner: doctor must say so cleanly (exit 1).
          python -m msi_rgb doctor || test $? -eq 1

      - name: Icon
        run: |
          python tools/make-icon.py build/icon.svg
          for s in 256 64 48 32 16; do
            rsvg-convert -w $s -h $s build/icon.svg -o build/icon-$s.png
          done
          python tools/make-ico.py packaging/windows/msirgb.ico \
            build/icon-256.png build/icon-64.png build/icon-48.png \
            build/icon-32.png build/icon-16.png

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/windows/msirgb.spec

      - name: Smoke-test the built executables
        env:
          GSK_RENDERER: cairo
        run: |
          cd "dist/MSI Mystic Light"
          ./msirgb.exe --help
          ./msirgb.exe effects
          ./msirgb.exe profile
          ./msirgb.exe doctor || test $? -eq 1
          # The panel is a windowed exe: run it, let it render, save a PNG.
          ./"MSI Mystic Light.exe" --screenshot "$GITHUB_WORKSPACE/panel.png" &
          pid=$!
          for i in $(seq 60); do [ -f "$GITHUB_WORKSPACE/panel.png" ] && break; sleep 1; done
          sleep 3
          kill $pid 2>/dev/null || true
          echo "--- panel log ---"
          cat "$USERPROFILE/.config/msi-rgb/msirgb.log" 2>/dev/null || true
          test -s "$GITHUB_WORKSPACE/panel.png"

      - name: Portable zip
        run: |
          cd dist
          python -c "import shutil; shutil.make_archive('MSI-Mystic-Light-portable', 'zip', '.', 'MSI Mystic Light')"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          iscc /DAppVersion=$ver packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: msi-mystic-light-windows
          path: |
            dist/MSI-Mystic-Light-Setup-*.exe
            dist/MSI-Mystic-Light-portable.zip
            panel.png

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MSI-Mystic-Light-Setup-*.exe
            dist/MSI-Mystic-Light-portable.zip
